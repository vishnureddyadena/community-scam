services:
  - type: web
    name: scamradar-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DISABLE_LICENSE_CHECK
        value: "true"
      - key: DATABASE_URL
        sync: false
