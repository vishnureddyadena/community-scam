<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23E000"/>
      <stop offset="100%" stop-color="#148000"/>
    </linearGradient>
    <radialGradient id="radarSweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#23E000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#23E000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Dark Background -->
  <rect width="512" height="512" rx="104" fill="#0A0A0A" />

  <!-- Outer Cyber Grid Lines -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#23E000" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#23E000" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="256" cy="256" r="110" fill="none" stroke="#23E000" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Radar Crosshairs -->
  <line x1="256" y1="46" x2="256" y2="466" stroke="#23E000" stroke-opacity="0.2" stroke-width="2"/>
  <line x1="46" y1="256" x2="466" y2="256" stroke="#23E000" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Radar Sweep Sector -->
  <path d="M 256 256 L 256 96 A 160 160 0 0 1 416 256 Z" fill="url(#radarSweep)"/>

  <!-- Security Shield Outer Shell -->
  <path d="M256 100 L370 148 C370 260 320 348 256 394 C192 348 142 260 142 148 Z" 
        fill="#0A0A0A" 
        stroke="url(#shieldGrad)" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Alert Core Triangle / Exclamation in Red -->
  <path d="M256 168 L320 280 L192 280 Z" fill="#E5201B"/>
  <circle cx="256" cy="252" r="7" fill="#F7F7F2"/>
  <rect x="252" y="198" width="8" height="38" rx="4" fill="#F7F7F2"/>

  <!-- Corner Tech Accent Brackets -->
  <path d="M 40 80 L 40 40 L 80 40" fill="none" stroke="#23E000" stroke-width="6"/>
  <path d="M 472 80 L 472 40 L 432 40" fill="none" stroke="#23E000" stroke-width="6"/>
  <path d="M 40 432 L 40 472 L 80 472" fill="none" stroke="#23E000" stroke-width="6"/>
  <path d="M 472 432 L 472 472 L 432 472" fill="none" stroke="#23E000" stroke-width="6"/>
</svg>